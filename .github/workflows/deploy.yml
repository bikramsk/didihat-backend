name: Deploy Strapi Backend to VPS

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy on Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            mkdir -p ${{ secrets.VPS_BACKEND_DIR }}
            cd ${{ secrets.VPS_BACKEND_DIR }}

            pm2 stop strapi || true

            # clean except public
            find . -mindepth 1 ! -path './public' ! -path './public/*' -exec rm -rf {} +

            rsync -av --delete --exclude='public/' ./ ${{ secrets.VPS_BACKEND_DIR }}

            export NODE_ENV=production
            npm ci
            npm run build

            pm2 start ecosystem.config.js --only strapi || pm2 restart strapi
            pm2 save
